<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030817">
<title>J.A.R.V.I.S. 3.0 — BLUE EDITION</title>

<style>
:root {
    --blue: #168bff;
    --cyan: #49c8ff;
    --bg: #030817;
    --panel: rgba(9, 25, 52, .88);
    --border: rgba(36, 151, 255, .35);
    --text: #eaf5ff;
    --muted: #8ba9ca;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 50% 15%, #102e59 0%, transparent 48%),
        var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    padding: 18px;
    overflow-x: hidden;
}

.app {
    max-width: 540px;
    margin: auto;
}

header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    width: 105px;
    height: 105px;
    border: 2px solid var(--blue);
    border-radius: 50%;
    margin: 0 auto 15px;
    display: grid;
    place-items: center;
    box-shadow: 0 0 25px #087fff88,
                inset 0 0 20px #087fff44;
    animation: reactor 3s infinite ease-in-out;
}

.logo span {
    font-size: 42px;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--blue);
}

@keyframes reactor {
    50% {
        box-shadow: 0 0 45px #087fffcc,
                    inset 0 0 30px #087fff88;
    }
}

h1 {
    color: var(--cyan);
    font-size: 27px;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #168bff;
}

.subtitle {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 8px;
}

.status-card,
.clock-card,
.chat-card,
.controls-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 5px 25px #0005;
}

.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.status-label {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
}

.status-value {
    color: #36b6ff;
    font-size: 12px;
    font-weight: bold;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    margin-right: 6px;
    box-shadow: 0 0 10px var(--blue);
}

.clock-card {
    text-align: center;
}

#clock {
    font-size: 34px;
    font-weight: bold;
    color: var(--cyan);
    letter-spacing: 2px;
}

#date {
    color: var(--muted);
    margin-top: 7px;
    font-size: 12px;
}

.section-title {
    color: var(--cyan);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 13px;
}

.chat-box {
    height: 290px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 5px 2px 12px;
    scroll-behavior: smooth;
}

.message {
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 13px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.bot {
    align-self: flex-start;
    background: #102c50;
    border: 1px solid #1769ad;
    border-bottom-left-radius: 3px;
}

.user {
    align-self: flex-end;
    background: #07569a;
    border: 1px solid #269fff;
    border-bottom-right-radius: 3px;
}

.typing {
    color: var(--cyan);
    font-size: 12px;
    padding: 5px;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

input {
    min-width: 0;
    flex: 1;
    background: #06152b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px #168bff55;
}

button, select {
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--blue);
    border-radius: 10px;
    padding: 11px 14px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    outline: none;
}

button:active {
    transform: scale(.92);
    background: #087fff44;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.send-btn {
    background: #07569a;
    color: white;
}

.controls-card {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.controls-card button {
    flex: 1;
    min-width: 110px;
}

select {
    background: #06152b;
    max-width: 100%;
}

footer {
    text-align: center;
    color: #597b9f;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 18px 0;
}

@media(max-width: 380px) {
    body { padding: 10px; }
    .chat-box { height: 260px; }
    button { padding: 10px; }
}
</style>
</head>

<body>
<div class="app">

<header>
    <div class="logo"><span>◈</span></div>
    <h1>J.A.R.V.I.S.</h1>
    <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
</header>

<div class="status-card">
    <div class="status-row">
        <span class="status-label">SYSTEM STATUS</span>
        <span class="status-value" id="status">
            <span class="dot"></span>INITIALIZING
        </span>
    </div>
</div>

<div class="clock-card">
    <div id="clock">00:00:00</div>
    <div id="date">Loading date...</div>
</div>

<div class="chat-card">
    <div class="section-title">◈ JARVIS COMMUNICATION</div>

    <div class="chat-box" id="chat">
        <div class="message bot">
            Good evening, Sir. I am JARVIS 3.0.

            Your AI system is ready. How may I assist you?
        </div>
    </div>

    <div class="input-row">
        <input
            id="messageInput"
            type="text"
            placeholder="Ask something, Sir..."
            autocomplete="off"
        >
        <button class="send-btn" id="sendBtn" type="button">
            SEND
        </button>
    </div>
</div>

<div class="controls-card">
    <button id="micBtn" type="button">🎤 MIC</button>
    <button id="stopBtn" type="button">🔇 STOP VOICE</button>

    <select id="language">
        <option value="en-US">English</option>
        <option value="hi-IN">Hindi</option>
    </select>
</div>

<footer>
    J.A.R.V.I.S. 3.0 · BLUE EDITION · AI SYSTEM
</footer>

</div>

<script>
"use strict";

// ======================================
// JARVIS CONFIGURATION
// ======================================

const WORKER_URL =
"https://purple-night-9332jarvis-ai-brain.ashsidetech.workers.dev/";

// ======================================
// ELEMENTS
// ======================================

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const stopBtn = document.getElementById("stopBtn");
const language = document.getElementById("language");

let isBusy = false;
let recognition = null;
let listening = false;

// ======================================
// CLOCK AND DATE
// ======================================

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("en-IN", {
            hour12: true
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

updateClock();
setInterval(updateClock, 1000);

// ======================================
// STATUS
// ======================================

function setStatus(message) {
    statusText.innerHTML =
        '<span class="dot"></span>' + message;
}

// ======================================
// CHAT MESSAGE
// ======================================

function addMessage(message, sender) {
    const div = document.createElement("div");

    div.className = "message " + sender;
    div.textContent = message;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

// ======================================
// VOICE RESPONSE
// ======================================

function speak(message) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = language.value;
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

function stopSpeech() {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
}

// ======================================
// SEND MESSAGE TO GEMINI THROUGH WORKER
// ======================================

async function sendMessage() {

    const message = input.value.trim();

    if (!message || isBusy) return;

    addMessage(message, "user");
    input.value = "";

    isBusy = true;
    sendBtn.disabled = true;

    setStatus("CONNECTING TO GEMINI...");

    const typing = addMessage("JARVIS IS THINKING...", "bot");
    typing.classList.add("typing");

    try {

        const response = await fetch(WORKER_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const rawResponse = await response.text();

        let data;

        try {
            data = JSON.parse(rawResponse);
        } catch {
            throw new Error(
                "Server returned an invalid response. Check Worker configuration."
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error || "Server error: " + response.status
            );
        }

        if (!data.success || !data.reply) {
            throw new Error(
                data.error || "AI reply was not received."
            );
        }

        typing.remove();

        addMessage(data.reply, "bot");
        speak(data.reply);

        setStatus("JARVIS ONLINE");

    } catch (error) {

        typing.remove();

        const errorMessage =
            "Sir, connection error: " + error.message;

        addMessage(errorMessage, "bot");

        setStatus("CONNECTION ERROR");

        console.error("JARVIS ERROR:", error);

    } finally {

        isBusy = false;
        sendBtn.disabled = false;
        input.focus();

    }
}

// ======================================
// BUTTON EVENTS
// ======================================

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

stopBtn.addEventListener("click", stopSpeech);

// ======================================
// VOICE RECOGNITION
// ======================================

function toggleMic() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        addMessage(
            "Sir, voice recognition is not supported in this browser. Please try Chrome.",
            "bot"
        );

        return;
    }

    if (listening && recognition) {
        recognition.stop();
        return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = language.value;
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        listening = true;
        micBtn.textContent = "🔴 LISTENING";
        setStatus("LISTENING...");
    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        input.value = transcript;

        sendMessage();
    };

    recognition.onerror = function(event) {

        addMessage(
            "Microphone error: " + event.error,
            "bot"
        );

        setStatus("MIC ERROR");
    };

    recognition.onend = function() {

        listening = false;
        micBtn.textContent = "🎤 MIC";

        if (!isBusy) {
            setStatus("JARVIS ONLINE");
        }
    };

    try {
        recognition.start();
    } catch (error) {
        console.error(error);
        setStatus("MIC ERROR");
    }
}

micBtn.addEventListener("click", toggleMic);

// ======================================
// LANGUAGE CHANGE
// ======================================

language.addEventListener("change", function() {

    if (recognition && listening) {
        recognition.stop();
    }

    stopSpeech();

});

// ======================================
// STARTUP
// ======================================

setStatus("JARVIS ONLINE");

console.log("J.A.R.V.I.S. 3.0 INITIALIZED");

</script>
</body>
</html>
